<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#f4efff">
<meta name="description" content="projectle: a daily estimation game. How many launchers does it take to land on the target?">
<title>projectle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --font: "Nunito", ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", sans-serif;
    --ink: #2e2a4f;
    --ink-soft: #6b6690;
    --paper: #fffdfb;
    --bg: #f4efff;
    --pink: #ff7aa8;
    --pink-deep: #f0548b;
    --mint: #6fdcbc;
    --yellow: #ffd45e;
    --red: #ff7b7b;
    --lilac: #b7a6ff;
    --sky: #bfe3ff;
    --shadow: 0 10px 30px rgba(70, 52, 140, .16), 0 2px 6px rgba(70, 52, 140, .08);
    --ease-out: cubic-bezier(.22, 1, .36, 1);
    --ease-back: cubic-bezier(.34, 1.56, .64, 1);
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bot: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: radial-gradient(1200px 800px at 50% -10%, #fff6fb 0%, var(--bg) 60%, #ebe4ff 100%); color: var(--ink); font-family: var(--font); overflow: hidden; }
  button { font-family: inherit; color: inherit; }
  #app { position: relative; margin: 0 auto; width: 100%; max-width: 520px; height: 100vh; height: 100dvh; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; background: #eaf4ff; }
  @media (min-width: 560px) { #app { box-shadow: 0 0 0 1px rgba(80, 60, 160, .08), 0 30px 80px rgba(80, 60, 160, .18); } }
  #gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .layer { position: absolute; inset: 0; pointer-events: none; }

  /* ---------- header ---------- */
  header { position: absolute; left: 0; right: 0; top: 0; padding: calc(10px + var(--safe-top)) 16px 0; display: flex; align-items: center; justify-content: space-between; pointer-events: none; z-index: 5; }
  .brand { display: flex; align-items: baseline; gap: 8px; }
  .wordmark { font-weight: 900; font-size: 28px; letter-spacing: -.5px; line-height: 1; color: var(--ink); }
  .wordmark b { color: var(--pink); font-weight: 900; }
  .puzzle-no { font-weight: 800; font-size: 13px; color: var(--ink-soft); background: rgba(255, 255, 255, .75); border-radius: 999px; padding: 3px 9px; backdrop-filter: blur(6px); }
  .icons { display: flex; gap: 6px; pointer-events: auto; }
  .icon-btn { width: 40px; height: 40px; border-radius: 14px; border: 0; background: rgba(255, 255, 255, .78); box-shadow: 0 2px 8px rgba(70, 52, 140, .12); display: grid; place-items: center; cursor: pointer; backdrop-filter: blur(6px); transition: transform .25s var(--ease-back), background .2s; }
  .icon-btn:hover { background: #fff; }
  .icon-btn:active { transform: scale(.9); }
  .icon-btn svg { width: 22px; height: 22px; stroke: var(--ink); stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .icon-btn:focus-visible, .btn:focus-visible { outline: 3px solid var(--lilac); outline-offset: 2px; }

  /* ---------- progress ---------- */
  #progress { position: absolute; top: calc(60px + var(--safe-top)); left: 16px; right: 16px; display: flex; gap: 6px; z-index: 4; transition: opacity .4s var(--ease-out); }
  #progress .step { flex: 1; height: 8px; border-radius: 99px; background: rgba(255, 255, 255, .7); box-shadow: inset 0 1px 2px rgba(70, 52, 140, .12); position: relative; overflow: hidden; }
  #progress .step::after { content: ""; position: absolute; inset: 0; border-radius: inherit; background: var(--c, var(--lilac)); transform: scaleX(var(--f, 0)); transform-origin: left; transition: transform .7s var(--ease-out), background .3s; }
  #progress .step.current { animation: pulse 1.6s ease-in-out infinite; }
  #progress.practice { opacity: .0; }
  @keyframes pulse { 50% { box-shadow: inset 0 0 0 2px rgba(183, 166, 255, .9); } }

  /* ---------- round info ---------- */
  #roundInfo { position: absolute; top: calc(78px + var(--safe-top)); left: 16px; right: 16px; display: flex; justify-content: space-between; align-items: flex-start; z-index: 4; transition: opacity .45s var(--ease-out), transform .45s var(--ease-out); }
  #roundInfo.hide { opacity: 0; transform: translateY(-6px); }
  .ri-left { display: flex; flex-direction: column; gap: 2px; }
  .ri-kicker { font-size: 12px; font-weight: 800; letter-spacing: .6px; text-transform: uppercase; color: var(--ink-soft); }
  .ri-title { font-size: 22px; font-weight: 900; line-height: 1.1; }
  .ri-sub { font-size: 13px; font-weight: 700; color: var(--ink-soft); }
  .ri-target { text-align: right; background: rgba(255, 255, 255, .8); border-radius: 16px; padding: 7px 12px; box-shadow: 0 2px 10px rgba(70, 52, 140, .1); backdrop-filter: blur(6px); }
  .ri-target small { display: block; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .5px; color: var(--ink-soft); }
  .ri-target span { font-size: 22px; font-weight: 900; color: var(--pink-deep); }

  /* ---------- count ---------- */
  #count { position: absolute; left: 0; right: 0; top: 27%; text-align: center; z-index: 3; transition: opacity .35s var(--ease-out), transform .45s var(--ease-out); }
  #count.hide { opacity: 0; transform: translateY(-14px) scale(.92); }
  #count .num { display: inline-block; font-size: 88px; font-weight: 900; line-height: .95; letter-spacing: -2px; color: var(--ink); text-shadow: 0 4px 0 rgba(255, 255, 255, .9), 0 10px 30px rgba(70, 52, 140, .18); }
  #count .word { display: block; font-size: 24px; font-weight: 900; color: var(--ink); margin-top: 2px; text-shadow: 0 2px 0 rgba(255, 255, 255, .9); }
  #count.zero .num, #count.zero .word { color: rgba(46, 42, 79, .35); }

  /* ---------- hint ---------- */
  #hint { position: absolute; left: 50%; bottom: calc(22px + var(--safe-bot)); transform: translateX(-50%); z-index: 3; background: rgba(255, 255, 255, .88); border-radius: 999px; padding: 10px 18px 10px 12px; font-weight: 800; font-size: 15px; display: flex; align-items: center; gap: 10px; box-shadow: var(--shadow); white-space: nowrap; transition: opacity .35s var(--ease-out), transform .45s var(--ease-out); }
  #hint.hide { opacity: 0; transform: translate(-50%, 12px); }
  #hint .hand { width: 30px; height: 30px; border-radius: 50%; background: var(--pink); display: grid; place-items: center; animation: drag 1.8s var(--ease-out) infinite; }
  #hint .hand svg { width: 18px; height: 18px; stroke: #fff; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  #hint kbd { font-family: inherit; font-size: 12px; background: #f1edff; border-radius: 6px; padding: 1px 6px; color: var(--ink-soft); }
  #hint .keys { display: none; color: var(--ink-soft); font-size: 13px; }
  @media (hover: hover) and (pointer: fine) { #hint .keys { display: inline; } }
  @keyframes drag { 0%, 15% { transform: translateX(0); } 60% { transform: translateX(-10px); } 100% { transform: translateX(0); } }

  /* ---------- pull indicator ---------- */
  #pull { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; opacity: 0; transition: opacity .2s; }
  #pull.on { opacity: 1; }

  /* ---------- world labels ---------- */
  .tag { position: absolute; left: 0; top: 0; z-index: 2; transform: translate(-50%, -100%); background: var(--pink-deep); color: #fff; font-weight: 900; font-size: 14px; padding: 5px 10px; border-radius: 999px; white-space: nowrap; box-shadow: 0 4px 14px rgba(240, 84, 139, .35); transition: opacity .3s; will-change: transform; display: flex; align-items: center; gap: 4px; }
  .tag.off { opacity: 0; }
  .tag svg { width: 14px; height: 14px; stroke: #fff; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; display: none; }
  .tag.edge svg { display: block; }
  #measure { background: var(--ink); box-shadow: 0 4px 14px rgba(46, 42, 79, .3); font-size: 15px; }

  /* ---------- sheets ---------- */
  .sheet { position: absolute; left: 10px; right: 10px; bottom: calc(10px + var(--safe-bot)); z-index: 8; background: var(--paper); border-radius: 28px; box-shadow: var(--shadow); padding: 20px 20px 18px; transform: translateY(calc(100% + 40px)); transition: transform .6s var(--ease-out); pointer-events: auto; max-height: calc(100% - 90px); overflow-y: auto; }
  .sheet.open { transform: translateY(0); }
  .res-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .res-score { font-size: 64px; font-weight: 900; line-height: .9; letter-spacing: -2px; }
  .res-score small { font-size: 20px; color: var(--ink-soft); letter-spacing: 0; margin-left: 2px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; font-weight: 900; font-size: 14px; border-radius: 999px; padding: 6px 12px; background: #f1edff; }
  .chip.t-bull { background: #ffe1ec; color: var(--pink-deep); }
  .chip.t-good { background: #fff3cc; color: #a77b00; }
  .chip.t-miss { background: #ffe3e3; color: #c4474f; }
  .res-off { font-size: 20px; font-weight: 900; margin: 10px 0 12px; }
  .res-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
  .res-cell { background: #f7f4ff; border-radius: 16px; padding: 10px 12px; }
  .res-cell small { display: block; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .5px; color: var(--ink-soft); }
  .res-cell b { font-size: 20px; font-weight: 900; }
  .btn { display: flex; width: 100%; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 18px; padding: 15px 18px; font-size: 18px; font-weight: 900; cursor: pointer; background: var(--ink); color: #fff; box-shadow: 0 6px 0 rgba(0, 0, 0, .18); transition: transform .2s var(--ease-back), box-shadow .2s; }
  .btn:active { transform: translateY(3px); box-shadow: 0 3px 0 rgba(0, 0, 0, .18); }
  .btn.pink { background: var(--pink-deep); }
  .btn.ghost { background: #f1edff; color: var(--ink); box-shadow: 0 4px 0 rgba(70, 52, 140, .12); }
  .btn-row { display: flex; gap: 10px; }
  .btn-row .btn { flex: 1; }
  .sum-title { font-size: 14px; font-weight: 800; color: var(--ink-soft); text-transform: uppercase; letter-spacing: .6px; }
  .sum-total { font-size: 60px; font-weight: 900; letter-spacing: -2px; line-height: 1; margin: 4px 0 6px; }
  .sum-total small { font-size: 22px; color: var(--ink-soft); letter-spacing: 0; }
  .sum-emoji { font-size: 28px; letter-spacing: 4px; margin-bottom: 10px; }
  .sum-rows { display: flex; flex-direction: column; gap: 6px; margin: 6px 0 14px; }
  .sum-row { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center; background: #f7f4ff; border-radius: 14px; padding: 8px 12px; font-weight: 800; font-size: 14px; }
  .sum-row .sr-c { color: var(--ink-soft); font-size: 13px; }
  .sum-row .sr-s { font-weight: 900; min-width: 34px; text-align: right; }
  .lb { display: none; background: linear-gradient(135deg, #fff0f6, #f1edff); border-radius: 16px; padding: 10px 14px; margin-bottom: 12px; font-weight: 800; font-size: 15px; }
  .lb.on { display: block; }
  .lb b { color: var(--pink-deep); }
  .next-in { text-align: center; color: var(--ink-soft); font-weight: 800; font-size: 13px; margin-top: 12px; }
  .next-in b { color: var(--ink); font-variant-numeric: tabular-nums; }

  /* ---------- modal ---------- */
  .modal { position: absolute; inset: 0; z-index: 20; display: grid; place-items: center; padding: 20px; background: rgba(46, 42, 79, .28); opacity: 0; pointer-events: none; transition: opacity .35s var(--ease-out); backdrop-filter: blur(3px); }
  .modal.open { opacity: 1; pointer-events: auto; }
  .card { width: 100%; max-width: 400px; background: var(--paper); border-radius: 28px; padding: 22px; box-shadow: var(--shadow); transform: translateY(20px) scale(.96); transition: transform .5s var(--ease-back); position: relative; max-height: 100%; overflow-y: auto; }
  .modal.open .card { transform: none; }
  .card h2 { margin: 0 0 12px; font-size: 24px; font-weight: 900; }
  .close { position: absolute; top: 14px; right: 14px; }
  .how { min-height: 250px; display: flex; flex-direction: column; align-items: center; text-align: center; }
  .how .pic { width: 100%; height: 150px; border-radius: 20px; background: linear-gradient(180deg, #dff0ff, #f6f1ff); display: grid; place-items: center; margin-bottom: 14px; overflow: hidden; }
  .how .pic svg { width: 100%; height: 100%; }
  .how h3 { margin: 0 0 6px; font-size: 20px; font-weight: 900; }
  .how p { margin: 0; color: var(--ink-soft); font-weight: 700; font-size: 15px; line-height: 1.4; }
  .dots { display: flex; gap: 6px; justify-content: center; margin: 16px 0 14px; }
  .dots i { width: 8px; height: 8px; border-radius: 9px; background: #e3ddff; transition: width .35s var(--ease-out), background .3s; }
  .dots i.on { width: 22px; background: var(--pink); }
  .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px; }
  .stat { background: #f7f4ff; border-radius: 16px; padding: 10px 6px; text-align: center; }
  .stat b { display: block; font-size: 24px; font-weight: 900; }
  .stat small { font-size: 11px; font-weight: 800; color: var(--ink-soft); text-transform: uppercase; letter-spacing: .4px; }
  .dist { display: flex; flex-direction: column; gap: 5px; }
  .dist-row { display: grid; grid-template-columns: 64px 1fr; align-items: center; gap: 8px; font-size: 12px; font-weight: 800; color: var(--ink-soft); }
  .dist-bar { height: 20px; border-radius: 7px; background: var(--lilac); min-width: 22px; color: #fff; font-size: 12px; font-weight: 900; display: flex; align-items: center; justify-content: flex-end; padding-right: 7px; transition: width .7s var(--ease-out); }
  .dist-bar.hi { background: var(--pink-deep); }
  .muted { color: var(--ink-soft); font-weight: 700; font-size: 14px; text-align: center; }

  /* ---------- stamp / toast / confetti ---------- */
  #stamp { position: absolute; left: 50%; top: 36%; z-index: 9; pointer-events: none; font-size: 54px; font-weight: 900; color: var(--pink-deep); letter-spacing: 1px; padding: 6px 20px; border: 6px solid var(--pink-deep); border-radius: 18px; background: rgba(255, 255, 255, .86); opacity: 0; transform: translate(-50%, -50%) rotate(-12deg) scale(2.2); white-space: nowrap; }
  #stamp.go { animation: stamp 1.9s var(--ease-out) forwards; }
  @keyframes stamp { 0% { opacity: 0; transform: translate(-50%, -50%) rotate(-12deg) scale(2.3); } 14% { opacity: 1; transform: translate(-50%, -50%) rotate(-12deg) scale(.94); } 22% { transform: translate(-50%, -50%) rotate(-12deg) scale(1.04); } 30%, 80% { opacity: 1; transform: translate(-50%, -50%) rotate(-12deg) scale(1); } 100% { opacity: 0; transform: translate(-50%, -50%) rotate(-12deg) scale(1.06); } }
  #confetti { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 9; pointer-events: none; }
  #toast { position: absolute; left: 50%; top: calc(18px + var(--safe-top)); z-index: 30; transform: translate(-50%, -80px); background: var(--ink); color: #fff; font-weight: 800; padding: 10px 18px; border-radius: 999px; transition: transform .5s var(--ease-back); pointer-events: none; white-space: nowrap; }
  #toast.on { transform: translate(-50%, 0); }
  #loading { position: absolute; inset: 0; z-index: 40; display: grid; place-items: center; background: var(--bg); transition: opacity .6s var(--ease-out); }
  #loading.done { opacity: 0; pointer-events: none; }
  #loading .wordmark { font-size: 40px; animation: bob 1.2s ease-in-out infinite; }
  #loading p { text-align: center; color: var(--ink-soft); font-weight: 800; }
  @keyframes bob { 50% { transform: translateY(-6px); } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .15s !important; }
    #stamp.go { animation: stampRM 1.9s linear forwards !important; animation-duration: 1.9s !important; }
    @keyframes stampRM { 0% { opacity: 0; transform: translate(-50%, -50%) rotate(-12deg); } 10%, 85% { opacity: 1; transform: translate(-50%, -50%) rotate(-12deg); } 100% { opacity: 0; transform: translate(-50%, -50%) rotate(-12deg); } }
  }
  @media (max-height: 640px) { #count { top: 25%; } #count .num { font-size: 70px; } .res-score { font-size: 52px; } }
</style>
</head>
<body>
<div id="app" aria-live="polite">
  <canvas id="gl" aria-label="Game view"></canvas>
  <svg id="pull" aria-hidden="true"><line id="pullLine" x1="0" y1="0" x2="0" y2="0" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 12" opacity=".95"/><circle id="pullStart" r="14" fill="none" stroke="#ffffff" stroke-width="4"/><circle id="pullEnd" r="9" fill="#ff7aa8" stroke="#fff" stroke-width="3"/></svg>

  <header>
    <div class="brand"><div class="wordmark">projectle</div><div class="puzzle-no" id="puzzleNo">No. 1</div></div>
    <div class="icons">
      <button class="icon-btn" id="btnHelp" aria-label="How to play"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5"/><path d="M9.3 9.2a2.8 2.8 0 1 1 4 2.6c-.8.4-1.3 1-1.3 1.9v.5"/><circle cx="12" cy="17.3" r=".6" fill="currentColor"/></svg></button>
      <button class="icon-btn" id="btnStats" aria-label="Statistics"><svg viewBox="0 0 24 24"><path d="M5 20V12M12 20V5M19 20v-9"/></svg></button>
      <button class="icon-btn" id="btnSound" aria-label="Toggle sound"><svg viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path class="wave" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/><path class="mute" d="M16 9.5l5 5M21 9.5l-5 5" style="display:none"/></svg></button>
    </div>
  </header>
  <div id="progress" aria-label="Progress"><div class="step"></div><div class="step"></div><div class="step"></div><div class="step"></div><div class="step"></div></div>
  <div id="roundInfo" class="hide">
    <div class="ri-left"><div class="ri-kicker" id="riKicker">round 1 of 5</div><div class="ri-title" id="riTitle">rubber duck</div><div class="ri-sub" id="riSub">1.1 kg</div></div>
    <div class="ri-target"><small>target</small><span id="riTarget">0 m</span></div>
  </div>
  <div id="count" class="hide zero"><span class="num" id="countNum">0</span><span class="word" id="countWord">fans</span></div>
  <div id="hint" class="hide"><span class="hand"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></span><span id="hintText">drag back to add fans</span><span class="keys">· <kbd>←</kbd><kbd>→</kbd> <kbd>enter</kbd></span></div>
  <div class="layer">
    <div class="tag off" id="targetTag"><span id="targetTagText">0 m</span><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></div>
    <div class="tag off" id="measure">0 m</div>
  </div>

  <section class="sheet" id="result" aria-label="Round result">
    <div class="res-top"><div class="res-score"><span id="resScore">0</span><small>/100</small></div><div class="chip" id="resChip">nice</div></div>
    <div class="res-off" id="resOff">1.8 m short</div>
    <div class="res-grid">
      <div class="res-cell"><small>you used</small><b id="resYou">7 fans</b></div>
      <div class="res-cell"><small>best count</small><b id="resBest">9 fans</b></div>
    </div>
    <div class="btn-row" id="resBtns"><button class="btn" id="btnNext">next round</button></div>
  </section>

  <section class="sheet" id="summary" aria-label="Daily summary">
    <div class="sum-title" id="sumTitle">projectle No. 1</div>
    <div class="sum-total"><span id="sumTotal">0</span><small>/500</small></div>
    <div class="sum-emoji" id="sumEmoji"></div>
    <div class="lb" id="lb"></div>
    <div class="sum-rows" id="sumRows"></div>
    <div class="btn-row"><button class="btn pink" id="btnShare">share</button><button class="btn ghost" id="btnPractice">practice</button></div>
    <div class="next-in">next puzzle in <b id="nextIn">--:--:--</b></div>
  </section>

  <div id="stamp" aria-hidden="true">BULLSEYE!</div>
  <canvas id="confetti" aria-hidden="true"></canvas>

  <div class="modal" id="helpModal" role="dialog" aria-modal="true" aria-labelledby="helpTitle">
    <div class="card">
      <button class="icon-btn close" data-close aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <h2 id="helpTitle">how to play</h2>
      <div class="how" id="howStep"></div>
      <div class="dots" id="howDots"><i class="on"></i><i></i><i></i></div>
      <button class="btn pink" id="howNext">next</button>
    </div>
  </div>
  <div class="modal" id="statsModal" role="dialog" aria-modal="true" aria-labelledby="statsTitle">
    <div class="card">
      <button class="icon-btn close" data-close aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <h2 id="statsTitle">statistics</h2>
      <div class="stats-grid" id="statsGrid"></div>
      <div class="sum-title" style="margin-bottom:8px">daily totals</div>
      <div class="dist" id="statsDist"></div>
    </div>
  </div>
  <div id="toast" role="status"></div>
  <div id="loading"><div><div class="wordmark">projectle</div><p id="loadMsg">loading…</p></div></div>
</div>

<!-- ================= CORE: physics + rounds (no DOM) ================= -->
<script>
/*CORE-START*/
/* =====================================================================
   PROJECTLE CORE — deterministic physics + daily round generation.
   No DOM, no Three.js. Pure IEEE-754 arithmetic only (no Math.sin/cos/
   exp/pow, which can differ between browsers), so every player gets
   bit-identical results for the same count.
   ===================================================================== */
var Core = (function () {
  'use strict';
  var PI = 3.141592653589793, TAU = 2 * PI, HALF = PI / 2;

  /* ---------- 1. LAUNCH DATE (puzzle No. 1) ------------------------- */
  var LAUNCH_DATE = '2026-11-01'; // YYYY-MM-DD, local time

/* ---------- distance markers: upright number boards on posts ----------
   They turn to face the locked camera and grow when zoomed out so the
   numbers never get smaller than MARK.minPx on screen.               */
const MARK = { every: 5, z: -1.32, tapeZ: -0.95, board: [0.7, 0.36], post: 0.45, minPx: 30, maxScale: 7 };
function buildMarkers(group, len) {
  const vals = []; for (let m = 0; m <= len; m += MARK.every) vals.push(m);
  const cols = 4, rows = Math.ceil(vals.length / cols), cw = 256, ch = 132;
  const atlas = canvasTex(cols * cw, rows * ch, (g) => {
    vals.forEach((m, i) => {
      const x = (i % cols) * cw, y = Math.floor(i / cols) * ch;
      g.fillStyle = '#ffffff'; g.strokeStyle = m === 0 ? '#7fd3c0' : '#ff7aa8'; g.lineWidth = 10;
      g.beginPath(); g.roundRect(x + 8, y + 8, cw - 16, ch - 16, 26); g.fill(); g.stroke();
      g.fillStyle = '#2e2a4f'; g.textAlign = 'center'; g.textBaseline = 'middle';
      g.font = '900 64px Nunito, ui-rounded, system-ui, sans-serif';
      g.fillText(m === 0 ? 'start' : m + ' m', x + cw / 2, y + ch / 2 + 3);
    });
  });
  const mat = new THREE.MeshBasicMaterial({ map: atlas, transparent: true, toneMapped: false });
  const [bw, bh] = MARK.board, boards = [];
  vals.forEach((m, i) => {
    const col = i % cols, row = Math.floor(i / cols);
    const geo = new THREE.PlaneGeometry(bw, bh), uv = geo.attributes.uv;
    for (let k = 0; k < uv.count; k++) uv.setXY(k, (col + uv.getX(k)) / cols, 1 - (row + 1 - uv.getY(k)) / rows);
    const b = new THREE.Mesh(geo, mat);
    b.rotation.order = 'YXZ'; b.rotation.y = -CAM.yaw * DEG; b.rotation.x = -CAM.pitch * DEG * 0.6;
    b.position.set(m, MARK.post + bh / 2, MARK.z); b.userData.m = m;
    group.add(b); boards.push(b);
  });
  const posts = new THREE.InstancedMesh(cyl(0.028, 0.032, 1, 10), M('#ffffff', { roughness: 0.3 }), vals.length);
  posts.castShadow = true; posts.frustumCulled = false; group.add(posts);
  return { boards, posts, vals };
}
function updateMarkers() {
  const mk = world && world.markers; if (!mk) return;
  const H = app.clientHeight, tv = Math.tan(camera.fov * DEG / 2), bh = MARK.board[1];
  mk.boards.forEach((b, i) => {
    tmpV2.set(b.userData.m, 0.6, MARK.z);
    const dist = camera.position.distanceTo(tmpV2);
    const sc = clamp(MARK.minPx * 2 * dist * tv / (bh * H), 1, MARK.maxScale);
    b.scale.setScalar(sc);
    b.position.y = (MARK.post + bh / 2) * sc;
    _m.compose(_v.set(b.userData.m, MARK.post * sc / 2, MARK.z), _q.identity(), _s.set(sc, MARK.post * sc + 0.02, sc));
    mk.posts.setMatrixAt(i, _m);
  });
  mk.posts.instanceMatrix.needsUpdate = true;
}

function buildProps(th, group, round) {
  const r = C.rng(C.hashStr(round.obj.id + th.sky[0]));
  const add = (geo, mat, list, cast = true) => {
    if (!list.length) return;
    const im = new THREE.InstancedMesh(geo, mat, list.length);
    list.forEach((it, i) => {
      _e.set(it.rx || 0, it.ry || 0, it.rz || 0); _q.setFromEuler(_e);
      _m.compose(_v.set(it.x, it.y, it.z), _q, _s.set(it.sx || 1, it.sy || it.sx || 1, it.sz || it.sx || 1));
      im.setMatrixAt(i, _m);
      if (it.c) im.setColorAt(i, new THREE.Color(it.c));
    });
    im.castShadow = cast; im.receiveShadow = true; group.add(im); return im;
  };
  const along = (step, x0 = -30, x1 = 130) => { const out = []; for (let x = x0; x < x1; x += step * (0.7 + r() * 0.6)) out.push(x); return out; };
  const pick = (arr) => arr[Math.floor(r() * arr.length)];
  const greens = ['#8fd97a', '#a6e38c', '#79cf86', '#b5e8a0'];

  for (const p of th.props) {

      add(cyl(0.12, 0.17, 1.4, 10), M('#c79a7a', { clearcoat: 0.1, roughness: 0.7 }), tr);
      add(sph(1, 20, 14), M('#ffffff', { roughness: 0.5, clearcoat: 0.3 }), cr);
    } else if (p === 'pine') {
      const xs = along(5), tr = [], cr = [], sn = [];
      xs.forEach((x) => { const z = -5 - r() * 10, s = 0.8 + r() * 0.8; tr.push({ x, y: 0.3 * s, z, sx: s }); cr.push({ x, y: 1.6 * s, z, sx: s, c: pick(['#7cc9a8', '#8fd3b4', '#6fbf9e']) }); sn.push({ x, y: 2.55 * s, z, sx: s * 0.5 }); });
      add(cyl(0.1, 0.13, 0.6, 8), M('#b78f74', { roughness: 0.8, clearcoat: 0 }), tr);
      add(new THREE.ConeGeometry(0.85, 2.3, 16), M('#ffffff', { roughness: 0.5, clearcoat: 0.2 }), cr);

    } else if (p === 'fence') {

      for (const y of [0.35, 0.65]) { const rail = mesh(new THREE.BoxGeometry(160, 0.08, 0.05), M('#ffffff', { roughness: 0.5 }), 50, y, -2.26, group); rail.castShadow = true; }
    } else if (p === 'building') {

    } else if (p === 'cloud') {

/* =====================================================================
   GAME STATE
   ===================================================================== */
const G = {
  mode: 'daily', day: null, plan: null, idx: 0,
  round: null, plan1: null, obj: null, objGroup: null, rig: null, info: null,
  phase: 'loading', count: 0, sim: null, playT: 0, ts: 1, introT: 0,
  settleT: 0, impactIdx: 0, loops: [], cam: { x: 0, y: 0.5, z: 0, d: 8 }, camGoal: { x: 0, y: 0.5, z: 0, d: 8 },
  zoom: 0, zoomGoal: 0, zoomV: { v: 0 }, zoomUser: false,
  squash: 0, practiceSeed: 0, lastRest: null
};

function loadDay() {
  const key = dateKey(), no = puzzleNo(key);
  let day = store.get('day', null);
  if (!day || day.key !== key) day = { key, no, results: [], recorded: false, submitted: false };
  day.no = no;
  G.day = day; G.plan = C.planDay(C.LAUNCH_DATE + '|' + key);
  $('#puzzleNo').textContent = 'No. ' + no;
}
function saveDay() { if (G.mode === 'daily') store.set('day', G.day); }

function setProgress() {
  const steps = document.querySelectorAll('#progress .step');
  $('#progress').classList.toggle('practice', G.mode !== 'daily');
  steps.forEach((s, i) => {
    const r = G.day && G.day.results[i];
    s.style.setProperty('--f', r ? 1 : 0);
    s.style.setProperty('--c', r ? TIER_COLOR[tier(r.score)] : '');
    s.classList.toggle('current', G.mode === 'daily' && i === G.idx && !r);
  });
}

function startRound(planEntry, opts = {}) {
  closeSheets();
  G.plan1 = planEntry;
  const round = C.solvePlan(planEntry);
  G.round = round; G.obj = round.obj; G.info = C.shapeInfo(round.obj);
  const themeKey = round.type === 'blower' ? 'ice' : round.obj.scene;
  buildWorld(themeKey, round);
  if (G.objGroup) disposeGroup(G.objGroup);
  G.objGroup = buildObject(round.obj); scene.add(G.objGroup);
  if (G.rig) disposeGroup(G.rig.group);
  G.lay = C.layout(round.obj, round.type);
  G.rig = makeRig(round.type, round.obj, G.lay);
  G.startY = G.lay.padH - G.info.minY;
  G.objGroup.position.set(0, G.startY, 0); G.objGroup.rotation.set(0, 0, 0); G.objGroup.scale.set(1, 1, 1);
  G.count = 0; G.sim = null; G.playT = 0; G.ts = 1; G.impactIdx = 0; G.settleT = 0; G.squash = 0;
  stopLoops(); Particles.clear();
  // HUD
  const kicker = G.mode === 'daily' ? `round ${G.idx + 1} of 5` : 'practice';
  $('#riKicker').textContent = kicker;
  $('#riTitle').textContent = round.obj.name;
  $('#riSub').textContent = round.obj.mass + ' kg · ' + C.LAUNCHERS[round.type].many + (round.type === 'blower' ? ' · on ice' : '');
  $('#riTarget').textContent = fmtM(round.target);
  $('#targetTagText').textContent = fmtM(round.target);
  $('#hintText').textContent = 'drag back to add ' + C.LAUNCHERS[round.type].many;
  updateCountLabel(false);
  $('#measure').classList.add('off');
  setProgress();
  if (opts.restAt != null) {
    // show a finished round (reload after completion)
    const sim = C.simulate(round.obj, round.type, opts.count, true);
    G.sim = sim; G.count = opts.count; G.playT = sim.time;
    G.rig.slots.forEach((s, i) => { s.target = i < opts.count ? 1 : 0; s.s = s.target; });
    applyFrame(sim.time); G.phase = 'done'; G.settleT = 10;
    $('#roundInfo').classList.remove('hide');
    G.zoom = G.zoomGoal = 1; G.zoomUser = false;
    snapCam(resultViews().at(1));
    return;
  }
  G.phase = 'intro'; G.introT = RM ? 99 : 0;
  G.zoomUser = false; G.zoomV.v = 0;
  snapCam(RM ? aimViews().at(aimViews().zDefault) : targetView());
  $('#roundInfo').classList.remove('hide');
  $('#count').classList.add('hide');
  $('#hint').classList.add('hide');
}

function beginAim() {
  G.phase = 'aim';
  $('#count').classList.remove('hide');
  $('#hint').classList.remove('hide');
}

function setCount(n, fromKeys = false) {
  n = clamp(n, 0, MAXN);
  if (n === G.count) return;
  const up = n > G.count;
  const old = G.count; G.count = n;
  G.rig.slots.forEach((s, i) => { s.target = i < n ? 1 : 0; });
  if (up) { Sound.add(n); buzz(8); } else { Sound.remove(old); buzz(4); }
  updateCountLabel(true);
}
function updateCountLabel(bump) {
  const n = G.count, type = G.round ? G.round.type : 'fan';
  $('#countNum').textContent = n;
  $('#countWord').textContent = word(type, n === 0 ? 2 : n);
  $('#count').classList.toggle('zero', n === 0);
  if (bump && !RM) {
    $('#countNum').animate([{ transform: 'scale(1)' }, { transform: 'scale(1.18) translateY(-4px)' }, { transform: 'scale(.97)' }, { transform: 'scale(1)' }], { duration: 320, easing: 'cubic-bezier(.34,1.56,.64,1)' });
  }
}

function launch() {
  if (G.phase !== 'aim' || G.count < 1) return;
  const n = G.count, round = G.round;
  G.sim = C.simulate(round.obj, round.type, n, true);
  G.playT = 0; G.ts = 1; G.impactIdx = 0; G.phase = 'flight';
  G.compress0 = G.rig.compress;
  const rest = G.sim.rest, score = C.score(rest, round.target, round.length);
  G.result = { count: n, rest, score, best: round.answer, target: round.target };
  if (G.mode === 'daily') { G.day.results[G.idx] = G.result; saveDay(); } // one attempt: saved at launch
  $('#count').classList.add('hide'); $('#hint').classList.add('hide');
  hidePull();
  Sound.whoosh(); buzz(18);
  if (round.type === 'spring') Sound.boing();
  if (round.type === 'rocket') Sound.ignite();
  if (round.type === 'fan') G.loops.push({ kind: 'fan', s: Sound.loop(380, 0.7) });
  if (round.type === 'blower') G.loops.push({ kind: 'blower', s: Sound.loop(1500, 1.4) });
  if (round.type === 'rocket') G.loops.push({ kind: 'rocket', s: Sound.loop(240, 0.5, 'lowpass') });
}
function stopLoops() { G.loops.forEach((l) => l.s.stop()); G.loops = []; }

/* ---------- playback ---------- */
const objWorld = new THREE.Matrix4();
function frameAt(t) {
  const f = G.sim.frames, n = f.length / 3 - 1;
  const u = clamp(t / C.DT, 0, n), i = Math.min(n - 1, Math.floor(u)), k = u - i;
  if (n <= 0) return { x: f[0], y: f[1], a: f[2], vx: 0, vy: 0 };
  return {
    x: lerp(f[i * 3], f[i * 3 + 3], k), y: lerp(f[i * 3 + 1], f[i * 3 + 4], k), a: lerp(f[i * 3 + 2], f[i * 3 + 5], k),
    vx: (f[i * 3 + 3] - f[i * 3]) / C.DT, vy: (f[i * 3 + 4] - f[i * 3 + 1]) / C.DT
  };
}
function applyFrame(t) {
  const s = frameAt(t);
  G.objGroup.position.set(s.x, s.y, 0); G.objGroup.rotation.set(0, 0, s.a);
  G.cur = s; return s;
}

/* ---------- camera ----------------------------------------------------
   Locked, angled "knife-flip" view: raised, tilted down and turned so
   the path runs diagonally away. Views are fitted to world-space bounds
   (object, launchers, target) inside the part of the screen the HUD
   leaves free, so framing works for any screen shape.               */

const confCanvas = $('#confetti'), cctx = confCanvas.getContext('2d');
let confParts = [], confRaf = 0;
function confetti(n) {
  const W = app.clientWidth, H = app.clientHeight, dpr = Math.min(2, devicePixelRatio || 1);
  confCanvas.width = W * dpr; confCanvas.height = H * dpr; cctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const cols = ['#ff7aa8', '#ffd45e', '#6fdcbc', '#b7a6ff', '#5fb8ff', '#ff9f43'];
  for (let i = 0; i < n; i++) confParts.push({ x: W / 2 + (Math.random() - 0.5) * 60, y: H * 0.38, vx: (Math.random() - 0.5) * 14, vy: -Math.random() * 15 - 4, r: Math.random() * 6, vr: (Math.random() - 0.5) * 0.4, w: 6 + Math.random() * 6, h: 8 + Math.random() * 8, c: cols[i % cols.length], life: 1 });
  if (!confRaf) confRaf = requestAnimationFrame(confStep);
}
function confStep() {
  const W = app.clientWidth, H = app.clientHeight;
  cctx.clearRect(0, 0, W, H);
  confParts = confParts.filter((p) => p.y < H + 40 && p.life > 0);
  for (const p of confParts) {
    p.vy += 0.42; p.vx *= 0.985; p.vy *= 0.985; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life -= 0.004;
    cctx.save(); cctx.translate(p.x, p.y); cctx.rotate(p.r); cctx.scale(Math.cos(p.r * 2), 1); cctx.fillStyle = p.c; cctx.globalAlpha = Math.min(1, p.life * 2);
    cctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); cctx.restore();
  }
  confRaf = confParts.length ? requestAnimationFrame(confStep) : 0;
}

/* =====================================================================
   LEADERBOARD (Supabase) — fully optional
   ===================================================================== */
const LB = {
  enabled: !!(SUPABASE_URL && SUPABASE_ANON_KEY), client: null,
  async get() {
    if (!this.enabled) return null;
    if (!this.client) {
      try { const mod = await import(SUPABASE_CDN); this.client = mod.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: false } }); }
      catch (e) { this.enabled = false; return null; }
    }
    return this.client;
  },
  async rank(no, total) {
    const c = await this.get(); if (!c) return null;
    const q = () => c.from(SCORES_TABLE).select('id', { count: 'exact', head: true }).eq('puzzle_no', no);
    const [all, above, below] = await Promise.all([q(), q().gt('total', total), q().lt('total', total)]);
    if (all.error || above.error || below.error) throw (all.error || above.error || below.error);
    const N = all.count || 0;
    return { rank: (above.count || 0) + 1, of: N, pct: N > 1 ? Math.round(100 * (below.count || 0) / (N - 1)) : 100 };
  }
};
async function submitScore() {
  const box = $('#lb'); box.classList.remove('on');
  if (!LB.enabled || G.mode !== 'daily') return;
  try {
    const c = await LB.get(); if (!c) return;
    const total = dayTotal();
    if (!G.day.submitted) {
      const row = { player_id: playerId(), puzzle_no: G.day.no, day: G.day.key, total, rounds: G.day.results.map((r) => r.score), counts: G.day.results.map((r) => r.count) };
      const { error } = await c.from(SCORES_TABLE).upsert(row, { onConflict: 'player_id,puzzle_no', ignoreDuplicates: true });
      if (error) throw error;
      G.day.submitted = true; saveDay();
    }
    const r = await LB.rank(G.day.no, total);
    if (!r || !r.of) return;
    box.innerHTML = `rank <b>#${r.rank}</b> of ${r.of} today · you beat <b>${r.pct}%</b> of players`;
    box.classList.add('on');
  } catch (e) { console.warn('[projectle] leaderboard unavailable', e); box.classList.remove('on'); }
}

/* =====================================================================
   INPUT — drag back to add launchers
   ===================================================================== */
const drag = { on: false, id: -1, x0: 0, y0: 0, prev: 0 };
const pointers = new Map();
const pinch = { on: false, d0: 1, z0: 0 };
function appXY(e) { const r = app.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
function pinchDist() { const [a, b] = [...pointers.values()]; return Math.max(20, Math.hypot(a.x - b.x, a.y - b.y)); }
app.addEventListener('pointerdown', (e) => {
  Sound.unlock();
  if (e.target.closest('button, .sheet, .modal, .icon-btn')) return;
  const p = appXY(e); pointers.set(e.pointerId, p);
  try { app.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
  if (pointers.size === 2 && zoomable()) {
    // second finger: this is a pinch, not a launcher drag
    if (drag.on) { drag.on = false; hidePull(); setCount(drag.prev); }
    Object.assign(pinch, { on: true, d0: pinchDist(), z0: G.zoomGoal });
    setZoomGoal(G.zoomGoal);
    return;
  }
  if (pointers.size > 1) return;
  if (G.phase === 'intro') { G.introT = 99; return; }
  if (G.phase !== 'aim' || drag.on) return;

  showPull(p, p);
});
app.addEventListener('pointermove', (e) => {

    return;
  }

  // "back" = away from the target (left) — vertical pull counts too so
  // the full range fits on a phone in portrait; forward (right) removes.
  const back = (drag.x0 - p.x) + Math.abs(p.y - drag.y0);

  showPull({ x: drag.x0, y: drag.y0 }, p);
});

  if (!drag.on || e.pointerId !== drag.id) return;
  drag.on = false; hidePull();
  if (!cancelled && G.count >= 1) launch(); else setCount(0);
}
app.addEventListener('pointerup', (e) => endPointer(e, false));
app.addEventListener('pointercancel', (e) => endPointer(e, true));
app.addEventListener('wheel', (e) => {
  if (e.target.closest('.sheet, .modal')) return;
  e.preventDefault();
  if (!zoomable()) return;
  const dy = e.deltaMode === 1 ? e.deltaY * 33 : e.deltaMode === 2 ? e.deltaY * 400 : e.deltaY;
  setZoomGoal(G.zoomGoal + clamp(dy, -120, 120) * CAM.wheelGain);
}, { passive: false });
function showPull(a, b) {
  const s = $('#pull'); s.classList.add('on');
  $('#pullLine').setAttribute('x1', a.x); $('#pullLine').setAttribute('y1', a.y); $('#pullLine').setAttribute('x2', b.x); $('#pullLine').setAttribute('y2', b.y);
  $('#pullStart').setAttribute('cx', a.x); $('#pullStart').setAttribute('cy', a.y);

}

window.addEventListener('keydown', (e) => {
  if ($('.modal.open')) { if (e.key === 'Escape') closeModals(); return; }
  if (G.phase === 'intro' && (e.key === 'Enter' || e.key.startsWith('Arrow'))) { G.introT = 99; e.preventDefault(); return; }
  if (G.phase === 'aim') {
    if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') { Sound.unlock(); setCount(G.count + 1); e.preventDefault(); }
    else if (e.key === 'ArrowDown' || e.key === 'ArrowRight') { setCount(G.count - 1); e.preventDefault(); }
    else if (e.key === 'Enter' || e.key === ' ') { Sound.unlock(); launch(); e.preventDefault(); }

  renderer.setSize(w, h, false);

}

  raf = requestAnimationFrame(frame);
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
  update(dt, now);
  renderer.render(scene, camera);
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { cancelAnimationFrame(raf); raf = 0; Sound.suspend(); }
  else { last = performance.now(); if (!raf) raf = requestAnimationFrame(frame); Sound.resume(); checkNewDay(); }
});
setInterval(() => { if (!document.hidden) { checkNewDay(); if ($('#summary').classList.contains('open')) nextCountdown(); } }, 1000);

/* ---------- boot ---------- */
resize();
syncSoundIcon();
resumeDaily();
nextCountdown();
requestAnimationFrame((t) => { last = t; raf = requestAnimationFrame(frame); });
requestAnimationFrame(() => requestAnimationFrame(() => $('#loading').classList.add('done')));
if (!store.get('seenHelp', false)) setTimeout(openHelp, 400);

// small hook for automated testing / debugging
window.__projectle = {
  G, C, setCount, launch, startPractice, openSummary,
  play(id, type, roundIdx = 2) { G.mode = 'practice'; const obj = C.OBJECTS.find((o) => o.id === id); startRound({ obj, type, roundIdx, seed: 1 }); G.introT = 99; },
  seek(t) { if (G.sim) G.playT = t; },
  settled() { return Math.abs(G.zoom - G.zoomGoal) < 0.005 && Math.abs(Math.log(G.cam.d / G.camGoal.d)) < 0.01 && Math.abs(G.cam.x - G.camGoal.x) < 0.05; },
  visCheck() { // are object + target inside the free screen area?
    const reg = safeRegion('result'), pts = targetPts(objPts([], 0)); let ok = true, worst = '';
    for (const p of pts) { const q = project(p.x, p.y, p.z); if (q.x < reg.left - 2 || q.x > reg.right + 2 || q.y < reg.top - 2 || q.y > reg.bottom + 2) { ok = false; worst = Math.round(q.x) + ',' + Math.round(q.y); } }
    return { ok, worst, rest: +G.result.rest.toFixed(1), T: +G.result.target.toFixed(1), score: G.result.score, d: +G.cam.d.toFixed(1) };
  },
  views() { const v = G.phase === 'aim' ? aimViews() : resultViews(); return { z: G.zoom, zg: G.zoomGoal, zd: v.zDefault, v0: v.at(0), v1: v.at(1), cam: { ...G.cam } }; }
};
</script>
